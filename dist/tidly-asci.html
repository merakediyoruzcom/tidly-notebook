<!DOCTYPE html>
<html lang="tr" data-palette="sepia" data-font="editorial" data-layout="river">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tidly Mutfak Defteri</title>
  <style id="tidly-core-css">/* src/styles/tokens.css */
:root {
  --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, Cambria, "Times New Roman", serif;
  --font-body: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --font-size-base: 16px;
  --r-card: 10px;
  --r-ctrl: 6px;
  --r-pill: 999px;
  --shadow-card: 0 1px 2px rgba(20, 16, 10, 0.05), 0 4px 12px rgba(20, 16, 10, 0.04);
  --shadow-float: 0 12px 32px rgba(15, 12, 8, 0.18);
  --sidebar-w: 336px;
  --river-max: 760px;
  --header-h: 52px;
  --bottom-nav-h: 60px;
  --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-palette="paper"] {
  --bg: #F3EFE6;
  --surface: #FAF8F3;
  --surface-2: #ECE6D9;
  --ink: #1F1C18;
  --muted: #5C554B;
  --border: #DDD5C7;
  --accent: #B8432E;
  --accent-ink: #FFFFFF;
  --accent-soft: #F5E3DE;
  --danger: #B42318;
  --ok: #1E6B45;
  --code-bg: #EFEAE0;
  --mark-bg: #F6DF9C;
}

html[data-palette="night"] {
  --bg: #141311;
  --surface: #1D1B18;
  --surface-2: #26231F;
  --ink: #EFEAE0;
  --muted: #A9A195;
  --border: #332F29;
  --accent: #E07258;
  --accent-ink: #141311;
  --accent-soft: #35231E;
  --danger: #F07167;
  --ok: #52B788;
  --code-bg: #171512;
  --mark-bg: #5B4A1B;
}

html[data-palette="sepia"] {
  --bg: #EDE2CC;
  --surface: #F6EFE0;
  --surface-2: #E4D5B8;
  --ink: #2C2217;
  --muted: #66543E;
  --border: #D2C09E;
  --accent: #8C4A1C;
  --accent-ink: #FFFDF8;
  --accent-soft: #E9D6C1;
  --danger: #A62C1E;
  --ok: #2B6A4A;
  --code-bg: #E7DAC0;
  --mark-bg: #EED184;
}

html[data-palette="forest"] {
  --bg: #111916;
  --surface: #18231E;
  --surface-2: #21302A;
  --ink: #E7EFEA;
  --muted: #98ADA2;
  --border: #2C3F37;
  --accent: #68B88E;
  --accent-ink: #0F1814;
  --accent-soft: #1E362B;
  --danger: #E07A7A;
  --ok: #68B88E;
  --code-bg: #121C18;
  --mark-bg: #2E523F;
}

html[data-palette="classroom"] {
  --bg: #F2F4EF;
  --surface: #FAFBF8;
  --surface-2: #E5EAE0;
  --ink: #17231C;
  --muted: #46574C;
  --border: #CFD8C9;
  --accent: #1F6B48;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFEFE6;
  --danger: #B42318;
  --ok: #1E6B45;
  --code-bg: #EAEEE6;
  --mark-bg: #F6DF9C;
}

html[data-palette="clinic"] {
  --bg: #EFF3F7;
  --surface: #F9FBFD;
  --surface-2: #E2EAF2;
  --ink: #12202E;
  --muted: #475B6D;
  --border: #CBD6E2;
  --accent: #145D8B;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDECF6;
  --danger: #B42318;
  --ok: #157347;
  --code-bg: #E7EEF5;
  --mark-bg: #F8E59A;
}

html[data-font="editorial"] {
  --font-reading: var(--font-display);
}

html[data-font="sans"] {
  --font-reading: var(--font-body);
}

html[data-font="mono"] {
  --font-reading: var(--font-mono);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


/* src/styles/layout.css */
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  font-size: var(--font-size-base);
  background: var(--bg);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  overflow-x: hidden;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.recovery-banner {
  background: var(--accent-soft);
  color: var(--ink);
  border-bottom: 1px solid var(--accent);
  padding: 10px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.875rem;
}

.recovery-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.mobile-topbar {
  display: none;
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.mobile-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
}

.mobile-brand-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mobile-top-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.workspace {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 24px;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px 64px;
}

.river-pane {
  flex: 1;
  min-width: 0;
  max-width: var(--river-max);
  width: 100%;
}

html[data-layout="split"] .river-pane {
  max-width: 1060px;
}

html[data-layout="split"] .story-river {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  align-items: start;
}

.story-river {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.focus-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-bottom: 8px;
  scrollbar-width: thin;
}

.sidebar-pane {
  width: var(--sidebar-w);
  flex-shrink: 0;
  position: sticky;
  top: 20px;
  max-height: calc(100vh - 40px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.sidebar-toggle-fab {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 25;
  display: none;
}

body.sidebar-collapsed .sidebar-pane {
  display: none;
}

body.sidebar-collapsed .sidebar-toggle-fab {
  display: inline-flex;
}

.mobile-bottom-nav {
  display: none;
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
}

.drawer-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 45;
  background: rgba(15, 12, 8, 0.48);
}

@media (max-width: 960px) {
  html[data-layout="split"] .story-river {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 767px) {
  .mobile-topbar {
    display: flex;
  }

  .workspace {
    padding: 12px 10px calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 12px) + 20px);
    gap: 0;
  }

  .river-pane {
    max-width: 100%;
  }

  .sidebar-toggle-fab {
    display: none !important;
  }

  .sidebar-pane {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(92vw, 380px);
    max-height: 100vh;
    z-index: 50;
    border-radius: 0;
    border-left: 1px solid var(--border);
    transform: translateX(105%);
    transition: transform 0.22s var(--ease-ui);
    display: flex !important;
  }

  body.drawer-open .sidebar-pane {
    transform: translateX(0);
  }

  body.drawer-open .drawer-backdrop {
    display: block;
  }

  .mobile-bottom-nav {
    display: grid;
  }
}

@media print {
  .mobile-topbar,
  .mobile-bottom-nav,
  .sidebar-pane,
  .sidebar-toggle-fab,
  .recovery-banner,
  .card-actions,
  .focus-tabs,
  .drawer-backdrop,
  .toast-stack,
  .modal-backdrop {
    display: none !important;
  }

  body, html {
    background: #ffffff !important;
    color: #000000 !important;
  }

  .workspace {
    padding: 0;
    max-width: 100%;
  }

  .tiddler-card {
    box-shadow: none !important;
    border: 1px solid #cccccc !important;
    break-inside: avoid;
  }
}


/* src/styles/components.css */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 12px;
  border-radius: var(--r-ctrl);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 500;
  line-height: 1.2;
  text-decoration: none;
  transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease;
}

.btn:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--muted);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.btn-primary:hover:not(:disabled) {
  filter: brightness(0.94);
  background: var(--accent);
  border-color: var(--accent);
}

.btn-danger {
  color: var(--danger);
  border-color: var(--border);
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger);
  color: #ffffff;
  border-color: var(--danger);
}

.btn-sm {
  min-height: 30px;
  padding: 4px 9px;
  font-size: 0.8125rem;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: var(--r-ctrl);
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  flex-shrink: 0;
}

.icon-btn:hover:not(:disabled) {
  background: var(--surface-2);
  color: var(--ink);
}

.icon-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

@media (max-width: 767px) {
  .btn, .icon-btn, .bottom-nav-btn, .tab-btn {
    min-width: 44px;
    min-height: 44px;
  }
  .btn-sm {
    min-height: 38px;
  }
}

.bottom-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--r-ctrl);
  padding: 4px 2px;
}

.bottom-nav-btn.is-active {
  color: var(--accent);
}

.bottom-nav-btn.is-create {
  color: var(--accent);
  font-weight: 600;
}

.dirty-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

.tiddler-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 3px solid var(--border);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-card);
  padding: 20px 24px;
  transition: border-color 0.15s ease;
}

.tiddler-card.is-active {
  border-top-color: var(--accent);
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.card-title-wrap {
  min-width: 0;
  flex: 1;
}

.card-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.55rem;
  line-height: 1.24;
  letter-spacing: -0.015em;
  overflow-wrap: break-word;
}

.card-meta-line {
  margin-top: 4px;
  font-size: 0.78rem;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.card-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.tag-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--ink);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
}

.tag-pill:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.tag-pill.is-system {
  font-family: var(--font-mono);
  font-size: 0.73rem;
}

.card-body {
  margin-top: 16px;
  font-family: var(--font-reading, var(--font-body));
  font-size: 1rem;
  line-height: 1.68;
  overflow-wrap: anywhere;
}

.card-body > :first-child { margin-top: 0; }
.card-body > :last-child { margin-bottom: 0; }

.card-body h1, .card-body h2, .card-body h3, .card-body h4 {
  font-family: var(--font-display);
  line-height: 1.28;
  margin: 1.3em 0 0.45em;
}

.card-body h1 { font-size: 1.45rem; }
.card-body h2 { font-size: 1.25rem; }
.card-body h3 { font-size: 1.08rem; }

.card-body p {
  margin: 0.75em 0;
}

.card-body ul, .card-body ol {
  margin: 0.7em 0;
  padding-left: 1.45em;
}

.card-body li {
  margin: 0.3em 0;
}

.card-body li.task-item {
  list-style: none;
  margin-left: -1.2em;
}

.card-body li.task-item label {
  display: inline-flex;
  align-items: flex-start;
  gap: 8px;
  cursor: pointer;
}

.card-body li.task-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin-top: 3px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

.card-body blockquote {
  margin: 1em 0;
  padding: 6px 14px;
  border-left: 3px solid var(--accent);
  background: var(--surface-2);
  border-radius: 0 var(--r-ctrl) var(--r-ctrl) 0;
  color: var(--muted);
}

.card-body blockquote p {
  margin: 0.25em 0;
}

.card-body mark {
  background: var(--mark-bg);
  color: var(--ink);
  padding: 1px 4px;
  border-radius: 3px;
}

.card-body code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--code-bg);
  padding: 2px 5px;
  border-radius: 4px;
}

.code-block {
  margin: 1em 0;
  border: 1px solid var(--border);
  border-radius: var(--r-ctrl);
  background: var(--code-bg);
  overflow: hidden;
}

.code-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--muted);
}

.copy-code-btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 0.72rem;
  cursor: pointer;
}

.copy-code-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.code-block pre {
  margin: 0;
  padding: 12px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 0.86rem;
  line-height: 1.5;
}

.code-block pre code {
  background: transparent;
  padding: 0;
}

.callout {
  margin: 1em 0;
  padding: 12px 14px;
  border-radius: var(--r-ctrl);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  background: var(--surface-2);
}

.callout-tip { border-left-color: var(--ok); }
.callout-warning { border-left-color: var(--danger); }

.callout-title {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 4px;
  color: var(--muted);
}

.table-wrap {
  margin: 1em 0;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-ctrl);
}

.table-wrap table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
  font-family: var(--font-body);
}

.table-wrap th, .table-wrap td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

.table-wrap th {
  background: var(--surface-2);
  font-weight: 600;
}

.table-wrap tr:last-child td {
  border-bottom: none;
}

.wiki-link {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  font-weight: 500;
}

.wiki-link:hover {
  border-bottom-color: var(--accent);
  background: var(--accent-soft);
}

.wiki-link.is-missing {
  color: var(--muted);
  border-bottom-style: dashed;
}

.wiki-img {
  max-width: 100%;
  height: auto;
  border-radius: var(--r-ctrl);
  border: 1px solid var(--border);
  display: block;
  margin: 10px 0;
}

.transclusion {
  margin: 1em 0;
  padding: 12px 16px;
  border-left: 3px solid var(--border);
  background: var(--surface-2);
  border-radius: 0 var(--r-ctrl) var(--r-ctrl) 0;
}

.transclusion-cycle, .macro-error {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--danger) 14%, transparent);
  color: var(--danger);
  font-size: 0.84rem;
  font-weight: 500;
}

.transclusion-missing, .macro-empty {
  color: var(--muted);
  font-style: italic;
}

.macro-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1px 8px;
  border-radius: var(--r-pill);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
  font-size: 0.85em;
}

.action-macro-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  margin: 4px 4px 4px 0;
  border-radius: var(--r-ctrl);
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
}

.action-macro-btn:hover {
  background: var(--accent);
  color: var(--accent-ink);
}

.card-info-panel {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--border);
  font-size: 0.86rem;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
}

.info-box {
  background: var(--surface-2);
  border-radius: var(--r-ctrl);
  padding: 8px 10px;
}

.info-box h4 {
  margin: 0 0 6px;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.info-export-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

/* Editor */
.editor-wrap {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.input, .select, .textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-ctrl);
  padding: 8px 10px;
  color: var(--ink);
}

.settings-group {

.settings-label {

.palette-grid {

et ayıklanmış çanak enginar\n- 150 g bezelye\n- 2 adet orta boy havuç\n- 1 adet patates\n- 1/2 su bardağı sızma zeytinyağı\n- 1 adet portakal suyu ve 1 adet limon suyu\n- Dereotu ve tuz\n\n\u003c\u003crecipe servings=\"6\"\u003e\u003e\n\n## Hazırlanışı\n1. Küp doğranmış sebzeleri enginar çanaklarına paylaştırın.\n2. Zeytinyağı, portakal suyu, limon ve tuzu ekleyip kısık ateşte pişirin.\n\n\u003c\u003ctimer minutes=\"30\" label=\"Enginar Pişirme\"\u003e\u003e","tags":["Tarif","Zeytinyağlı"],"type":"text/vnd.tidly","created":"20261124102321715","modified":"20261124102321715","fields":{"kategori":"Zeytinyağlı","hazirlik":"15 dk","pisirme":"30 dk"},"attachments":[]},{"title":"Alışveriş Listesi","text":"# Mutfak Alışveriş Listesi\n\nTarif kartlarındaki **Alışveriş Listesine Ekle** düğmesine bastığında malzemeler ölçeklenmiş miktarlarıyla buraya eklenir.\n\n## Alınacaklar\n- [ ] Kuru nane\n- [ ] Sızma zeytinyağı","tags":["Mutfak","Liste"],"type":"text/vnd.tidly","created":"20261124102321715","modified":"20261124102321715","fields":{},"attachments":[]},{"title":"Şablon: Tarif","text":"# ${baslik}\n\n**Kategori:** {{!!kategori}} · **Hazırlık:** {{!!hazirlik}} · **Pişirme:** {{!!pisirme}}\n\n## Malzemeler\n- 200 g \n- 1 yemek kaşığı \n\n\u003c\u003crecipe servings=\"4\"\u003e\u003e\n\n## Hazırlanışı\n1. \n\n\u003c\u003ctimer minutes=\"20\" label=\"Pişirme Süresi\"\u003e\u003e","tags":["$:/tags/Template","Tarif"],"type":"text/vnd.tidly","created":"20261124102321715","modified":"20261124102321715","fields":{"kategori":"Ana Yemek","hazirlik":"15 dk","pisirme":"20 dk"},"attachments":[]},{"title":"Şablon: Haftalık Menü","text":"# ${baslik}\n\n| Gün | Öğle | Akşam | Not |\n| --- | --- | --- | --- |\n| Pazartesi | [[Tarif: Mercimek Çorbası]] | [[Tarif: Zeytinyağlı Enginar]] | |\n| Salı | | | |\n| Çarşamba | | | |","tags":["$:/tags/Template","Menü"],"type":"text/vnd.tidly","created":"20261124102321715","modified":"20261124102321715","fields":{"hafta":"${tarih}"},"attachments":[]},{"       rows.push(row);

      cell = '';
    } else {
      cell += ch;

    row.push(cell);
    rows.push(row);
  }

function csvToMarkdownTable(csvText) {
  const clean = String(csvText == null ? '' : csvText).replace(/^\uFEFF/, '').trim();

    '| ' + headerCells.map(() => '---').join(' | ') + ' |'

      const val = named[p] !== undefined ? named[p] : (positional[idx] !== undefined ? positional[idx] : '');
      nextVars[p] = val;
      body = body.replaceAll('$' + p + '$', val);
    });
    for (const [k, v] of Object.entries(nextVars)) {
      body = body.replaceAll('$(' + k + ')$', String(v));
    }
    return renderWikiText(body, store, {
      currentTiddler,
      vars: nextVars,
      renderStack: [...renderStack, stackKey],
      maxDepth,
      lang
    });
  }

  return escapeHtml('<<' + rawCall + '>>');
}

function renderTransclusion(rawInner, isBlock, store, options) {
  const { currentTiddler = '', vars = {}, renderStack = [], maxDepth = DEFAULT_MAX_DEPTH, lang = 'tr' } = options;
  const fieldIdx = rawInner.indexOf('!!');
  if (fieldIdx >= 0) {
    const target = rawInner.slice(0, fieldIdx).trim();
    const field = rawInner.slice(fieldIdx + 2).trim();
    const val = resolveField(store, target, field, currentTiddler);
    return isBlock ? '<p class="transclusion-field">' + escapeHtml(val) + '</p>' : escapeHtml(val);
  }

  const target = rawInner.trim();
  if (!target) return '';
  if (!store || !store.has(target)) {
    const msg = t('missingTransclusion', lang, { title: target });
    return '<span class="transclusion-missing">' + escapeHtml(msg) + '</span>';
  }
  const stackKey = 'card:' + target;
  if (renderStack.includes(stackKey) || renderStack.length >= maxDepth) {
    const msg = t('cycleWarning', lang, { title: target });
    return '<span class="transclusion-cycle">' + escapeHtml(msg) + '</span>';
  }

  const targetText = store.getText(target);
  const innerHtml = renderWikiText(targetText, store, {
    currentTiddler: target,
    vars,
    renderStack: [...renderStack, stackKey],
    maxDepth,
    lang

  if (isBlock) {
    return '<div class="transclusion" data-transcluded="' + escapeHtml(target) + '">' + innerHtml + '</div>';

  return '<span class="transclusion-inline" data-transcluded="' + escapeHtml(target) + '">' + innerHtml + '</span>';
}

function renderInline(raw, store, options) {
  const tokens = [];
  const hold = (html) => {
    const idx = tokens.length;
    tokens.push(html);
    return '\uE000T' + idx + '\uE001';
  };

  let s = String(raw == null ? '' : raw);

  // 1. Protect inline code first
  s = s.replace(/`([^`\n]+)`/g, (_, code) => hold('<code>' + escapeHtml(code) + '</code>'));

  // 2. Protect macros <<...>>
  s = s.replace(/<<([^>\n]+)>>/g, (_, inner) => hold(renderMacroCall(inner, store, options)));

  // 3. Protect wiki links [[...]] BEFORE transclusions/md links so [[{{!!title}}]] resolves
  s = s.replace(/\[\[([^\]\n]+)\]\]/g, (_, inner) => {
    const pipeIdx = inner.indexOf('|');
    const rawLabel = pipeIdx >= 0 ? inner.slice(0, pipeIdx) : inner;
    const rawTarget = pipeIdx >= 0 ? inner.slice(pipeIdx + 1) : inner;
    const label = expandFieldTokensInString(rawLabel, store, options.currentTiddler).trim();
    const target = expandFieldTokensInString(rawTarget, store, options.currentTiddler).trim();
    if (!target) return escapeHtml('[[' + inner + ']]');
    const missing = store && !store.has(target) ? ' is-missing' : '';
    return hold(
      '<a class="wiki-link' + missing + '" data-tiddler="' + escapeHtml(target) + '" href="#' + encodeURIComponent(target) + '">' +
      escapeHtml(label || target) + '</a>'
    );
  });

  // 4. Protect transclusions {{...}}
  s = s.replace(/\{\{([^}\n]+)\}\}/g, (_, inner) => hold(renderTransclusion(inner, false, store, options)));

  // 5. Protect images ![alt](url)
  s = s.replace(/!\[([^\]\n]*)\]\(([^)\s]+)\)/g, (full, alt, url) => {
    if (!isSafeUrl(url, true)) return escapeHtml(full);
    return hold('<img class="wiki-img" src="' + escapeHtml(url) + '" alt="' + escapeHtml(alt) + '" loading="lazy">');
  });

  // 6. Protect markdown links [text](url)
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (full, label, url) => {
    if (!isSafeUrl(url, false)) return escapeHtml(full);
    const ext = url.startsWith('#') ? '' : ' target="_blank" rel="noopener noreferrer"';
    return hold('<a href="' + escapeHtml(url) + '"' + ext + '>' + escapeHtml(label) + '</a>');
  });

  // 7. Escape all remaining raw HTML in prose
  s = escapeHtml(s);

  // 8. Safe inline formatting on escaped text
  s = s.replace(/\*\*([^\n*]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^\n*]+?)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/~~([^\n~]+?)~~/g, '<del>$1</del>');
  s = s.replace(/==([^\n=]+?)==/g, '<mark>$1</mark>');

  // 9. Restore tokens
  return s.replace(/\uE000T(\d+)\uE001/g, (_, idx) => tokens[Number(idx)] || '');
}

function splitTableRow(line) {
  let trimmed = line.trim();
  if (trimmed.startsWith('|')) trimmed = trimmed.slice(1);
  if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);
  return trimmed.split('|').map((c) => c.trim());
}

function renderWikiText(text, store, options = {}) {
  const {
    currentTiddler = '',
    vars = {},
    renderStack = [],
    maxDepth = DEFAULT_MAX_DEPTH,
    lang = 'tr'
  } = options;

  const macros = extractMacros(store, text);
  const macroMap = new Map(macros);
  const cleanedText = collectMacrosFromText(text, macroMap, true);
  const ctx = { currentTiddler, vars, renderStack, maxDepth, lang, macros: macroMap };

  const lines = cleanedText.split(/\r?\n/);
  const blocks = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // Blank line
    if (/^\s*$/.test(line)) {
      i++;
      continue;
    }

    // Fenced code block
    const fenceMatch = /^\s*(```|~~~)(.*)$/.exec(line);
    if (fenceMatch) {
      const fence = fenceMatch[1];
      const codeLang = fenceMatch[2].trim();
      i++;
      const codeLines = [];
      while (i < lines.length && !lines[i].trim().startsWith(fence)) {
        codeLines.push(lines[i]);
        i++;
      }
      if (i < lines.length) i++;
      const rawCode = codeLines.join('\n');
      blocks.push(
        '<div class="code-block">' +
          '<div class="code-head"><span>' + escapeHtml(codeLang || 'text') + '</span>' +
          '<button type="button" class="copy-code-btn" data-copy-code="1">' + escapeHtml(lang === 'en' ? 'Copy' : 'Kopyala') + '</button></div>' +
          '<pre><code>' + escapeHtml(rawCode) + '</code></pre>' +
        '</div>'
      );
      continue;
    }

    // Heading
    const headingMatch = /^(#{1,6})\s+(.*)$/.exec(line);
    if (headingMatch) {
      const level = headingMatch[1].length;
      blocks.push('<h' + level + '>' + renderInline(headingMatch[2].trim(), store, ctx) + '</h' + level + '>');
      i++;
      continue;
    }

    // Horizontal rule
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      blocks.push('<hr>');
      i++;
      continue;
    }

    // Standalone block transclusion {{Target}}
    const transMatch = /^\s*\{\{([^}\n]+)\}\}\s*$/.exec(line);
    if (transMatch) {
      blocks.push(renderTransclusion(transMatch[1], true, store, ctx));
      i++;
      continue;
    }

    // Standalone block macro <<...>>
    const macroBlockMatch = /^\s*<<([^>\n]+)>>\s*$/.exec(line);
    if (macroBlockMatch) {
      const html = renderMacroCall(macroBlockMatch[1], store, ctx);
      if (/^<(ul|div|table|p|button)\b/i.test(html)) {
        blocks.push(html);
      } else if (html) {
        blocks.push('<p>' + html + '</p>');
      }
      i++;
      continue;
    }

    // Blockquote / Callout
    if (/^\s*>\s?/.test(line)) {
      const qLines = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        qLines.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      const calloutMatch = /^\[!(NOT|İPUCU|IPUCU|UYARI|NOTE|TIP|WARNING)\]\s*(.*)$/i.exec(qLines[0] || '');
      if (calloutMatch) {
        const rawKind = calloutMatch[1].toUpperCase();
        const kindMap = {
          NOT: 'note',
          NOTE: 'note',
          İPUCU: 'tip',
          IPUCU: 'tip',
          TIP: 'tip',
          UYARI: 'warning',
          WARNING: 'warning'
        };
        const kind = kindMap[rawKind] || 'note';
        const titleLabel = rawKind;
        const bodyLines = [];
        if (calloutMatch[2]) bodyLines.push(calloutMatch[2]);
        for (let q = 1; q < qLines.length; q++) bodyLines.push(qLines[q]);
        blocks.push(
          '<div class="callout callout-' + kind + '">' +
            '<div class="callout-title">' + escapeHtml(titleLabel) + '</div>' +
            '<div class="callout-body">' + renderInline(bodyLines.join(' '), store, ctx) + '</div>' +
          '</div>'
        );
      } else {
        blocks.push('<blockquote><p>' + renderInline(qLines.join(' '), store, ctx) + '</p></blockquote>');
      }
      continue;
    }

    // Markdown table
    if (
      i + 1 < lines.length &&
      lines[i].includes('|') &&
      /^\s*\|?(?:\s*:?-+:?\s*\|)+\s*(?::?-+:?\s*\|?)?\s*$/.test(lines[i + 1])
    ) {
      const headers = splitTableRow(lines[i]);
      i += 2;
      const bodyRows = [];
      while (i < lines.length && lines[i].includes('|') && !/^\s*$/.test(lines[i])) {
        bodyRows.push(splitTableRow(lines[i]));
        i++;
      }
      const headHtml = '<thead><tr>' + headers.map((h) => '<th>' + renderInline(h, store, ctx) + '</th>').join('') + '</tr></thead>';
      const bodyHtml = '<tbody>' + bodyRows.map((row) =>
        '<tr>' + headers.map((_, idx) => '<td>' + renderInline(row[idx] || '', store, ctx) + '</td>').join('') + '</tr>'
      ).join('') + '</tbody>';
      blocks.push('<div class="table-wrap"><table>' + headHtml + bodyHtml + '</table></div>');
      continue;
    }

    // Unordered / Task list
    if (/^\s*[-*+]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        const content = lines[i].replace(/^\s*[-*+]\s+/, '');
        const taskMatch = /^\[([ xX])\]\s+(.*)$/.exec(content);
        if (taskMatch) {
          const checked = taskMatch[1] !== ' ' ? ' checked' : '';
          items.push(
            '<li class="task-item"><label>' +
              '<input type="checkbox" data-task-line="' + i + '" data-task-tiddler="' + escapeHtml(currentTiddler) + '"' + checked + '> ' +
              '<span>' + renderInline(taskMatch[2], store, ctx) + '</span>' +
            '</label></li>'
          );
        } else {
          items.push('<li>' + renderInline(content, store, ctx) + '</li>');
        }
        i++;
      }
      blocks.push('<ul>' + items.join('') + '</ul>');
      continue;
    }

    // Ordered list
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        const content = lines[i].replace(/^\s*\d+\.\s+/, '');
        items.push('<li>' + renderInline(content, store, ctx) + '</li>');
        i++;
      }
      blocks.push('<ol>' + items.join('') + '</ol>');
      continue;
    }

    // Paragraph
    const pLines = [];
    while (
      i < lines.length &&
      !/^\s*$/.test(lines[i]) &&
      !/^\s*(```|~~~)/.test(lines[i]) &&
      !/^#{1,6}\s+/.test(lines[i]) &&
      !/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i]) &&
      !/^\s*\{\{[^}\n]+\}\}\s*$/.test(lines[i]) &&
      !/^\s*<<[^>\n]+>>\s*$/.test(lines[i]) &&
      !/^\s*>\s?/.test(lines[i]) &&
      !/^\s*[-*+]\s+/.test(lines[i]) &&
      !/^\s*\d+\.\s+/.test(lines[i])
    ) {
      pLines.push(lines[i]);
      i++;
    }
    if (pLines.length) {
      blocks.push('<p>' + pLines.map((l) => renderInline(l, store, ctx)).join('<br>') + '</p>');
    } else {
      i++;
    }
  }

  return blocks.join('\n');
}

__exp.toggleTaskCheckbox = toggleTaskCheckbox;
__exp.extractMacros = extractMacros;
__exp.renderWikiText = renderWikiText;

"src/core/crypto.js": function (__req, __exp) {
const DEFAULT_ITERATIONS = 250000;

function isCryptoAvailable() {
  return Boolean(
    typeof globalThis.crypto !== 'undefined' &&
    globalThis.crypto.subtle &&
    typeof globalThis.crypto.getRandomValues === 'function'
  );
}

function isEncryptedEnvelope(obj) {
  return Boolean(
    obj &&
    typeof obj === 'object' &&
    obj.encrypted === true &&
    obj.alg === 'AES-GCM-256' &&
    typeof obj.ciphertext === 'string' &&
    typeof obj.iv === 'string' &&
    typeof obj.salt === 'string'
  );
}

function bytesToBase64(bytes) {
  let bin = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk) {
    const slice = bytes.subarray(i, i + chunk);
    bin += String.fromCharCode.apply(null, slice);
  }
  return btoa(bin);
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) {
    out[i] = bin.charCodeAt(i);
  }
  return out;
}

function sanitizeMeta(meta = {}) {
  return {
    wikiId: String(meta.wikiId || ''),
    updatedAt: String(meta.updatedAt || ''),
    lang: meta.lang === 'en' ? 'en' : 'tr',
    palette: String(meta.palette || 'paper')
  };
}

async function deriveKey(password, saltB64, iterations = DEFAULT_ITERATIONS) {
  if (!isCryptoAvailable()) {
    throw new Error('Web Crypto API is not available in this context.');
  }
  const enc = new TextEncoder();
  const baseKey = await globalThis.crypto.subtle.importKey(
    'raw',
    enc.encode(String(password)),
    'PBKDF2',
    false,
    ['deriveKey']
  );
  const saltBytes = base64ToBytes(saltB64);
  return globalThis.crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: saltBytes,
      iterations,
      hash: 'SHA-256'
    },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptWithDerivedKey(plainObj, key, saltB64, meta = {}, iterations = DEFAULT_ITERATIONS) {
  if (!isCryptoAvailable()) {
    throw new Error('Web Crypto API is not available in this context.');
  }
  const iv = globalThis.crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const plaintext = enc.encode(JSON.stringify(plainObj));
  const encryptedBuf = await globalThis.crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key,
    plaintext
  );
  return {
    v: 1,
    encrypted: true,
    alg: 'AES-GCM-256',
    kdf: 'PBKDF2-SHA256',
    iterations,
    salt: saltB64,
    iv: bytesToBase64(iv),
    ciphertext: bytesToBase64(new Uint8Array(encryptedBuf)),
    meta: sanitizeMeta(meta)
  };
}

async function encryptStorePayload(plainObj, password, meta = {}) {
  if (!isCryptoAvailable()) {
    throw new Error('Web Crypto API is not available in this context.');
  }
  const saltBytes = globalThis.crypto.getRandomValues(new Uint8Array(16));
  const salt = bytesToBase64(saltBytes);
  const key = await deriveKey(password, salt, DEFAULT_ITERATIONS);
  const envelope = await encryptWithDerivedKey(plainObj, key, salt, meta, DEFAULT_ITERATIONS);
  return { envelope, key, salt };
}

async function decryptStoreEnvelope(envelope, password) {
  if (!isCryptoAvailable()) {
    throw new Error('Web Crypto API is not available in this context.');
  }
  if (!isEncryptedEnvelope(envelope)) {
    throw new Error('Invalid encrypted envelope.');
  }
  const iterations = Number(envelope.iterations) || DEFAULT_ITERATIONS;
  const key = await deriveKey(password, envelope.salt, iterations);
  const ivBytes = base64ToBytes(envelope.iv);
  const cipherBytes = base64ToBytes(envelope.ciphertext);
  let decryptedBuf;
  try {
    decryptedBuf = await globalThis.crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: ivBytes },
      key,
      cipherBytes
    );
  } catch {
    const err = new Error('Invalid password or corrupted data.');
    err.code = 'INVALID_PASSWORD';
    throw err;
  }
  const dec = new TextDecoder();
  const payload = JSON.parse(dec.decode(decryptedBuf));
  return { payload, key, salt: envelope.salt };
}

__exp.isCryptoAvailable = isCryptoAvailable;
__exp.isEncryptedEnvelope = isEncryptedEnvelope;
__exp.deriveKey = deriveKey;
__exp.encryptWithDerivedKey = encryptWithDerivedKey;
__exp.encryptStorePayload = encryptStorePayload;
__exp.decryptStoreEnvelope = decryptStoreEnvelope;
},

  const sepIdx = src.indexOf('\n\n');
  const headerBlock = sepIdx >= 0 ? src.slice(0, sepIdx) : src;
  const body = sepIdx >= 0 ? src.slice(sepIdx + 2) : '';
  const raw = { text: body, fields: {} };

  for (const line of headerBlock.split('\n')) {
    const colon = line.indexOf(':');
    if (colon <= 0) continue;
    const key = line.slice(0, colon).trim();
    const val = line.slice(colon + 1).trim();
    if (key === 'tags') raw.tags = parseTagString(val);
    else if (key === 'title' || key === 'type' || key === 'created' || key === 'modified') raw[key] = val;
    else raw.fields[key] = val;
  }

  return normalizeImportedRecord(raw, fallbackTitle);
}

function exportMarkdown(tiddler) {
  const lines = ['---'];
  lines.push('title: ' + JSON.stringify(tiddler.title));
  if (tiddler.tags && tiddler.tags.length) {
    lines.push('tags: ' + JSON.stringify(tiddler.tags));
  }
  if (tiddler.created) lines.push('created: ' + JSON.stringify(tiddler.created));
  if (tiddler.modified) lines.push('modified: ' + JSON.stringify(tiddler.modified));
  const fieldKeys = Object.keys(tiddler.fields || {}).sort();
  for (const k of fieldKeys) {
    lines.push('field_' + k + ': ' + JSON.stringify(String(tiddler.fields[k])));
  }
  lines.push('---');
  lines.push('');
  lines.push(String(tiddler.text || ''));
  return lines.join('\n');
}

function parseYamlScalar(raw) {
  const s = raw.trim();
  if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) {
    try {
      return s.startsWith('"') ? JSON.parse(s) : s.slice(1, -1);
    } catch {
      return s.slice(1, -1);
    }
  }
  if (s.startsWith('[') && s.endsWith(']')) {
    try {
      return JSON.parse(s);
    } catch {
      return s.slice(1, -1).split(',').map((x) => x.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
    }
  }
  return s;
}

function importMarkdown(text, fallbackTitle = 'İçe Aktarılan') {
  const src = String(text || '').replace(/\r\n/g, '\n');
  const fmMatch = /^---\n([\s\S]*?)\n---\n?/.exec(src);
  if (!fmMatch) {
    return normalizeImportedRecord({ title: fallbackTitle, text: src }, fallbackTitle);
  }
  const raw = { text: src.slice(fmMatch[0].length).replace(/^\n/, ''), fields: {} };
  for (const line of fmMatch[1].split('\n')) {
    const colon = line.indexOf(':');
    if (colon <= 0) continue;
    const key = line.slice(0, colon).trim();
    const val = parseYamlScalar(line.slice(colon + 1));
    if (key === 'title') raw.title = String(val);
    else if (key === 'tags') raw.tags = Array.isArray(val) ? val : parseTagString(String(val));
    else if (key === 'created' || key === 'modified' || key === 'type') raw[key] = String(val);
    else if (key.startsWith('field_')) raw.fields[key.slice(6)] = String(val);
    else raw.fields[key] = String(val);
  }
  return normalizeImportedRecord(raw, fallbackTitle);
}

function importHtml(htmlText) {
  const src = String(htmlText || '');

  const tidlyStore = extractStoreFromHtml(src);
  if (tidlyStore) {
    if (isEncryptedEnvelope(tidlyStore)) {
      return { tiddlers: [], source: 'tidly', encrypted: true };
    }
    const list = Array.isArray(tidlyStore.tiddlers) ? tidlyStore.tiddlers : [];
    return {
      tiddlers: list.map((x, idx) => normalizeImportedRecord(x, 'Kart #' + (idx + 1))),
      source: 'tidly',
      encrypted: false
    };
  }

  const closeTag = '<' + '/script>';
  const tw5Marker = '<script class="tiddlywiki-tiddler-store" type="application/json">';
  const tw5Start = src.indexOf(tw5Marker);
  if (tw5Start >= 0) {
    const bodyStart = tw5Start + tw5Marker.length;
    const tw5End = src.indexOf(closeTag, bodyStart);
    if (tw5End > bodyStart) {
      const parsed = JSON.parse(src.slice(bodyStart, tw5End).trim());
      const arr = Array.isArray(parsed) ? parsed : [];
      const isTw5Enc = arr.some((item) => item && item.title === '$:/isEncrypted' && item.text === 'yes');
      if (isTw5Enc) {
        return { tiddlers: [], source: 'tiddlywiki5', encrypted: true };
      }
      return {
        tiddlers: arr.map((x, idx) => normalizeImportedRecord(x, 'TW5 #' + (idx + 1))),
        source: 'tiddlywiki5',
        encrypted: false
      };
    }
  }

  return { tiddlers: [], source: 'unknown', encrypted: false };
}

__exp.importCsv = importCsv;
__exp.exportJson = exportJson;
__exp.importJson = importJson;
__exp.exportTid = exportTid;
__exp.importTid = importTid;
__exp.exportMarkdown = exportMarkdown;
__exp.importMarkdown = importMarkdown;
__exp.importHtml = importHtml;

"src/storage/persistence.js": function (__req, __exp) {
const DB_NAME = 'tidly-notebook-backups';
const STORE_NAME = 'snapshots';
const DB_VERSION = 1;
const LS_PREFIX = 'tidly-backup:';

function openDb() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') {
      reject(new Error('IndexedDB unavailable'));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
  });
}

async function saveBackup(wikiId, data) {
  const key = String(wikiId || 'default');
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(data, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    return true;
  } catch {
    try {
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem(LS_PREFIX + key, JSON.stringify(data));
        return true;
      }
    } catch {
      return false;
    }
    return false;
  }
}

async function loadBackup(wikiId) {
  const key = String(wikiId || 'default');
  try {
    const db = await openDb();
    const res = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    if (res) return res;
  } catch {
    // Fallback to localStorage below
  }
  try {
    if (typeof localStorage !== 'undefined') {
      const raw = localStorage.getItem(LS_PREFIX + key);
      return raw ? JSON.parse(raw) : null;
    }
  } catch {
    return null;
  }
  return null;
}

async function clearBackup(wikiId) {
  const key = String(wikiId || 'default');
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch {
    // Ignore IndexedDB errors on clear
  }
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.removeItem(LS_PREFIX + key);
    }
  } catch {
    // Ignore localStorage errors
  }
}

function downloadTextFile(content, filename, mime = 'text/plain;charset=utf-8') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    if (a.parentNode) a.parentNode.removeChild(a);
  }, 1500);
}

async function saveHtmlToDisk(html, filename = 'tidly-notebook.html', cachedHandle = null) {
  let handle = cachedHandle;
  if (typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function') {
    try {
      if (!handle) {
        handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'HTML Wiki', accept: { 'text/html': ['.html', '.htm'] } }]
        });
      }
      const writable = await handle.createWritable();
      await writable.write(html);
      await writable.close();
      return { method: 'fsa', handle };
    } catch (err) {
      if (err && err.name === 'AbortError') {
        throw err;
      }
      handle = null;
    }
  }
  downloadTextFile(html, filename, 'text/html;charset=utf-8');
  return { method: 'download', handle: null };
}

async function shareHtmlMobile(html, filename = 'tidly-notebook.html') {
  if (typeof navigator !== 'undefined' && typeof navigator.share === 'function' && typeof File === 'function') {
    try {
      const file = new File([html], filename, { type: 'text/html' });
      if (!navigator.canShare || navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return 'shared';
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return 'shared';
    }
  }
  downloadTextFile(html, filename, 'text/html;charset=utf-8');
  return 'download';
}

__exp.saveBackup = saveBackup;
__exp.loadBackup = loadBackup;
__exp.clearBackup = clearBackup;
__exp.downloadTextFile = downloadTextFile;
__exp.saveHtmlToDisk = saveHtmlToDisk;
__exp.shareHtmlMobile = shareHtmlMobile;
},

"src/packs/index.js": function (__req, __exp) {
const { generateWikiId, twTimestamp } = __req("src/core/utils.js");
const { createStarterTiddlers } = __req("src/seed/starter-tiddlers.js");
const { TEACHER_PACK } = __req("src/packs/teacher.js");
const { DOCTOR_PACK } = __req("src/packs/doctor.js");
const { CHEF_PACK } = __req("src/packs/chef.js");
const { STUDENT_PACK } = __req("src/packs/student.js");

const WORKSPACE_PACKS = [
  {
    id: 'general',
    filename: 'tidly-notebook.html',
    siteTitle: 'Tidly Notebook',
    siteSubtitle: 'Tek dosyalık kişisel bilgi tabanın',
    palette: 'paper',
    defaultTiddlers: '[[Hoş Geldiniz]] [[Hızlı Başlangıç]]',
    landingCard: 'Hoş Geldiniz',
    nameTr: 'Genel / Standart',
    nameEn: 'General / Standard',
    descTr: 'Klasik kişisel wiki: bağlantılar, iç içe gömme, dinamik filtreler ve özgür kart düzeni.',
    descEn: 'Classic personal wiki with links, transclusions, dynamic filters, and freeform cards.',
    badgeTr: 'Varsayılan',
    createTiddlers: createStarterTiddlers
  },
  TEACHER_PACK,
  DOCTOR_PACK,
  CHEF_PACK,
  STUDENT_PACK
];

function getPackById(packId) {
  return WORKSPACE_PACKS.find((p) => p.id === packId) || WORKSPACE_PACKS[0];
}

function buildEditionStoreData(packId) {
  const pack = getPackById(packId);
  const ts = twTimestamp();
  const baseTiddlers = pack.createTiddlers();
  const existingTitles = new Set(baseTiddlers.map((t) => t.title));

  const systemTiddlers = [
    { title: '$:/SiteTitle', text: pack.siteTitle, type: 'text/plain' },
    { title: '$:/SiteSubtitle', text: pack.siteSubtitle, type: 'text/plain' },
    { title: '$:/Palette', text: pack.palette, type: 'text/plain' },
    { title: '$:/DefaultTiddlers', text: pack.defaultTiddlers, type: 'text/plain' },
    { title: '$:/ActiveMode', text: pack.id, type: 'text/plain' }
  ];

  const tiddlers = [...baseTiddlers];
  for (const sys of systemTiddlers) {
    if (!existingTitles.has(sys.title)) {
      tiddlers.push({
        title: sys.title,
        text: sys.text,
        tags: [],
        type: sys.type,
        created: ts,
        modified: ts,
        fields: {},
        attachments: []
      });
    }
  }

  return {
    v: 1,
    wikiId: generateWikiId(),
    updatedAt: ts,
    tiddlers
  };
}

function mergePackIntoStore(store, packId, { applyTheme = true } = {}) {
  const pack = getPackById(packId);
  const cards = pack.createTiddlers();
  const added = [];

  for (const card of cards) {
    if (!store.hasUser(card.title)) {
      store.put(card, { recordUndo: false, touchModified: false });
      added.push(card.title);
    }
  }

  store.put({ title: '$:/ActiveMode', text: pack.id, type: 'text/plain' }, { recordUndo: false });
  if (applyTheme) {
    store.put({ title: '$:/Palette', text: pack.palette, type: 'text/plain' }, { recordUndo: false });
  }
  return added;
}

__exp.WORKSPACE_PACKS = WORKSPACE_PACKS;
__exp.getPackById = getPackById;
__exp.buildEditionStoreData = buildEditionStoreData;
__exp.mergePackIntoStore = mergePackIntoStore;
},

"src/ui/theme.js": function (__req, __exp) {
const { runFilter } = __req("src/core/filter.js");

const VALID_PALETTES = new Set(['paper', 'night', 'sepia', 'forest', 'classroom', 'clinic']);
const VALID_FONTS = new Set(['editorial', 'sans', 'mono']);
const VALID_LAYOUTS = new Set(['river', 'focus', 'split']);
const ALLOWED_COLOR_KEYS = new Set(['bg', 'surface', 'ink', 'accent']);

function getWikiLang(store) {
  const raw = store.getText('$:/Language', 'tr').trim().toLowerCase();
  return raw === 'en' ? 'en' : 'tr';
}

function applyThemeFromStore(store) {
  if (typeof document === 'undefined') return;
  const root = document.documentElement;

  const palette = store.getText('$:/Palette', 'paper').trim();
  root.setAttribute('data-palette', VALID_PALETTES.has(palette) ? palette : 'paper');

  const font = store.getText('$:/Font', 'editorial').trim();
  root.setAttribute('data-font', VALID_FONTS.has(font) ? font : 'editorial');

  const layout = store.getText('$:/Layout', 'river').trim();
  root.setAttribute('data-layout', VALID_LAYOUTS.has(layout) ? layout : 'river');

  const sizeNum = Math.min(22, Math.max(13, parseInt(store.getText('$:/FontSize', '16'), 10) || 16));
  root.style.setProperty('--font-size-base', sizeNum + 'px');

  const lang = getWikiLang(store);
  root.setAttribute('lang', lang);

  const siteTitle = store.getText('$:/SiteTitle', 'Tidly Notebook').trim() || 'Tidly Notebook';
  document.title = siteTitle;

  // Apply custom palette overrides safely
  for (const key of ALLOWED_COLOR_KEYS) {
    root.style.removeProperty('--' + key);
  }
  root.style.removeProperty('--surface-2');
  root.style.removeProperty('--accent-soft');
  try {
    const rawColors = store.getText('$:/CustomColors', '{}');
    const custom = JSON.parse(rawColors);
    if (custom && typeof custom === 'object') {
      for (const [k, v] of Object.entries(custom)) {
        if (ALLOWED_COLOR_KEYS.has(k) && /^#[0-9a-fA-F]{6}$/.test(String(v))) {
          root.style.setProperty('--' + k, String(v));
        }
      }
      if (custom.accent && /^#[0-9a-fA-F]{6}$/.test(custom.accent)) {
        root.style.setProperty('--accent-soft', 'color-mix(in srgb, ' + custom.accent + ' 14%, transparent)');
      }
      if (custom.surface && /^#[0-9a-fA-F]{6}$/.test(custom.surface)) {
        root.style.setProperty('--surface-2', 'color-mix(in srgb, ' + custom.surface + ' 92%, var(--ink) 8%)');
      }
    }
  } catch {
    // Ignore malformed custom color JSON
  }

  // Apply user CSS cards tagged $:/tags/Stylesheet
  let styleEl = document.getElementById('tidly-user-styles');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'tidly-user-styles';
    styleEl.setAttribute('data-runtime', 'true');
    document.head.appendChild(styleEl);
  }
  const userCssTitles = [
    ...runFilter('[all[tiddlers]tag[$:/tags/Stylesheet]sort[title]]', store).titles,
    ...runFilter('[all[system]tag[$:/tags/Stylesheet]sort[title]]', store).titles
  ];
  const uniqueTitles = Array.from(new Set(userCssTitles));
  const combinedCss = uniqueTitles
    .map((title) => '/* ' + title + ' */\n' + store.getText(title))
    .join('\n\n')
    .replace(/<\/style/gi, '');
  styleEl.textContent = combinedCss;
}

__exp.getWikiLang = getWikiLang;
__exp.applyThemeFromStore = applyThemeFromStore;
},
"src/ui/widgets.js": function (__req, __exp) {
const { t } = __req("src/core/i18n.js");
const { markdownTableToCsv } = __req("src/core/attachments.js");
const { appendTableRow, scaleIngredientLine, calculateBmi, calculateWeightDose } = __req("src/core/widgets.js");
const { downloadTextFile } = __req("src/storage/persistence.js");
const { showToast } = __req("src/ui/modals.js");

const timerStates = new Map();
const runningIntervals = new Set();

function clearIntervals() {
  for (const id of runningIntervals) {
    clearInterval(id);
  }
  runningIntervals.clear();
}

function formatClock(totalSec) {
  const sec = Math.max(0, Math.floor(totalSec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function playGentleChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, ctx.currentTime);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
  } catch {
    // Ignore audio context restrictions
  }
}

function wireInteractiveWidgets(container, app, { resetTimers = false } = {}) {
  if (resetTimers) clearIntervals();
  const lang = app.lang();
  const isEn = lang === 'en';

  // 1. Gradebook widgets
  container.querySelectorAll('[data-widget="gradebook"]').forEach((box) => {
    const tiddlerTitle = box.getAttribute('data-tiddler');
    const form = box.querySelector('[data-gb-form]');
    const csvBtn = box.querySelector('[data-gb-csv]');

    if (form && tiddlerTitle) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const inputs = Array.from(form.querySelectorAll('[data-gb-col]'));
        const values = inputs.map((inp) => inp.value.trim());
        if (!values.some(Boolean)) return;
        const item = app.store.get(tiddlerTitle);
        if (!item) return;
        const nextText = appendTableRow(item.text, values);
        app.store.put({ ...item, text: nextText });
        app.render();
      });
    }

    if (csvBtn && tiddlerTitle) {
      csvBtn.addEventListener('click', () => {
        const item = app.store.get(tiddlerTitle);
        if (!item) return;
        const csv = markdownTableToCsv(item.text, ';');
        const safeName = tiddlerTitle.replace(/[^\w.-]+/g, '_') + '.csv';
        downloadTextFile(csv, safeName, 'text/csv;charset=utf-8');
      });
    }
  });

  // 2. Recipe widgets
  container.querySelectorAll('[data-widget="recipe"]').forEach((box) => {
    const base = Math.max(1, Number(box.getAttribute('data-base-servings')) || 4);
    let cur = base;
    const countEl = box.querySelector('[data-recipe-count]');
    const listEl = box.querySelector('[data-recipe-list]');
    const multBtns = Array.from(box.querySelectorAll('[data-recipe-mult]'));

    const updateView = () => {
      const ratio = cur / base;
      if (countEl) {
        countEl.textContent = cur + ' ' + (isEn ? 'servings' : 'kişilik');
      }
      multBtns.forEach((b) => {
        const m = Number(b.getAttribute('data-recipe-mult'));
        b.classList.toggle('btn-primary', Math.abs(m - ratio) < 0.01);
      });
      if (listEl) {
        listEl.querySelectorAll('[data-raw-ing]').forEach((li) => {
          const raw = li.getAttribute('data-raw-ing') || '';
          li.textContent = scaleIngredientLine(raw, ratio);
        });
      }
    };

    box.querySelectorAll('[data-recipe-step]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const delta = Number(btn.getAttribute('data-recipe-step')) || 0;
        cur = Math.max(0.5, Math.round((cur + delta) * 2) / 2);
        updateView();
      });
    });

    multBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const mult = Number(btn.getAttribute('data-recipe-mult')) || 1;
        cur = Math.max(0.5, Math.round(base * mult * 2) / 2);
        updateView();
      });
    });

    const shopBtn = box.querySelector('[data-recipe-shop]');
    if (shopBtn) {
      shopBtn.addEventListener('click', () => {
        const ratio = cur / base;
        const lines = Array.from(box.querySelectorAll('[data-raw-ing]'))
          .map((li) => '- [ ] ' + scaleIngredientLine(li.getAttribute('data-raw-ing') || '', ratio));
        if (!lines.length) return;
        const listTitle = isEn ? 'Shopping List' : 'Alışveriş Listesi';
        const existing = app.store.get(listTitle);
        const sourceCard = box.getAttribute('data-tiddler') || '';
        const header = sourceCard ? '\n\n### ' + sourceCard + ' (' + cur + ')\n' : '\n';
        const prevText = existing ? existing.text : '# ' + listTitle;
        app.store.put({
          title: listTitle,
          text: prevText + header + lines.join('\n'),
          tags: existing ? existing.tags : ['Mutfak', 'Liste']
        });
        showToast(t('shoppingListAdded', lang), {
          actionLabel: t('attachmentOpen', lang),
          onAction: () => app.openCard(listTitle)
        });
      });
    }
  });

  // 3. Timer widgets
  container.querySelectorAll('[data-widget="timer"]').forEach((box) => {
    const mins = Math.max(1, Number(box.getAttribute('data-minutes')) || 15);
    const label = box.getAttribute('data-label') || 'Timer';
    const key = label + ':' + mins;
    let state = timerStates.get(key);
    if (!state) {
      state = { remaining: mins * 60, running: false };
      timerStates.set(key, state);
    }

    const dispEl = box.querySelector('[data-timer-display]');
    const toggleBtn = box.querySelector('[data-timer-toggle]');
    const resetBtn = box.querySelector('[data-timer-reset]');

    const renderClock = () => {
      if (dispEl) dispEl.textContent = formatClock(state.remaining);
      if (toggleBtn) {
        toggleBtn.textContent = state.running
          ? (isEn ? 'Pause' : 'Duraklat')
          : (isEn ? 'Start' : 'Başlat');
      }
    };

    const startTick = () => {
      const id = setInterval(() => {
        if (!state.running || !document.body.contains(box)) {
          clearInterval(id);
          runningIntervals.delete(id);
          return;
        }
        if (state.remaining > 0) {
          state.remaining--;
          renderClock();
          if (state.remaining === 0) {
            state.running = false;
            renderClock();
            playGentleChime();
            showToast(label + ': 00:00');
          }
        }
      }, 1000);
      runningIntervals.add(id);
    };

    if (state.running) startTick();
    renderClock();

    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        if (state.remaining === 0) state.remaining = mins * 60;
        state.running = !state.running;
        renderClock();
        if (state.running) startTick();
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        state.running = false;
        state.remaining = mins * 60;
        renderClock();
      });
    }

    box.querySelectorAll('[data-timer-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const addSec = Number(btn.getAttribute('data-timer-add')) || 0;
        state.remaining = Math.max(0, state.remaining + addSec);
        renderClock();
      });
    });
  });

  // 4. Clinical calculators
  container.querySelectorAll('[data-widget="calc"]').forEach((box) => {
    const kind = box.getAttribute('data-calc-type');
    const outEl = box.querySelector('[data-calc-out]');
    const update = () => {
      if (!outEl) return;
      if (kind === 'bmi') {
        const w = box.querySelector('[data-calc-w]').value;

    };

    update();

function getToastStack() {
  let stack = document.querySelector('.toast-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.className = 'toast-stack';
    stack.setAttribute('aria-live', 'polite');
    document.body.appendChild(stack);
  }
  return stack;
}

function showToast(msg, { actionLabel = '', onAction = null, duration = 4200 } = {}) {
  if (typeof document === 'undefined') return;
  const stack = getToastStack();
  const el = document.createElement('div');
  el.className = 'toast';
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);

  if (actionLabel && typeof onAction === 'function') {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-action';
    btn.textContent = actionLabel;
    btn.addEventListener('click', () => {
      onAction();
      el.remove();
    });
    el.appendChild(btn);
  }

  stack.appendChild(el);
  setTimeout(() => {
    if (el.parentNode) el.remove();
  }, duration);
}

function createModal({ title, wide = false, onClose = null }) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.setAttribute('role', 'dialog');
  backdrop.setAttribute('aria-modal', 'true');

  const card = document.createElement('div');
  card.className = 'modal-card' + (wide ? ' is-wide' : '');

  const head = document.createElement('div');
  head.className = 'modal-head';
  const h2 = document.createElement('h2');
  h2.textContent = title;
  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'icon-btn';
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.innerHTML = icon('close', 18);

  head.appendChild(h2);
  head.appendChild(closeBtn);
  card.appendChild(head);
  backdrop.appendChild(card);

  const close = () => {
    document.removeEventListener('keydown', onKey);
    if (backdrop.parentNode) backdrop.remove();
    if (typeof onClose === 'function') onClose();
  };

  const onKey = (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      close();
    }
  };

  closeBtn.addEventListener('click', close);
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) close();
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(backdrop);

  return { backdrop, card, close };
}

function openCommandPalette(app) {
  const lang = app.lang();
  const { card, close } = createModal({ title: t('search', lang) });

  const input = document.createElement('input');
  input.type = 'search';
  input.className = 'input';
  input.placeholder = t('paletteSearchPlaceholder', lang);
  input.setAttribute('aria-label', t('paletteSearchPlaceholder', lang));

  const listEl = document.createElement('div');
  listEl.className = 'palette-results';
  card.appendChild(input);
  card.appendChild(listEl);

  const commands = [
    { label: t('cmdNewCard', lang), kind: 'cmd', run: () => app.createNewCard() },
    { label: t('cmdModes', lang), kind: 'cmd', run: () => openModesModal(app) },
    { label: t('cmdSave', lang), kind: 'cmd', run: () => app.saveHtml() },
    { label: t('cmdGraph', lang), kind: 'cmd', run: () => app.openGraph() },
    { label: t('cmdToggleTheme', lang), kind: 'cmd', run: () => app.toggleDayNight() },
    { label: t('cmdCycleLayout', lang), kind: 'cmd', run: () => app.cycleLayout() },
    { label: t('cmdExportJson', lang), kind: 'cmd', run: () => app.exportJsonAll() },
    { label: t('cmdEncryption', lang), kind: 'cmd', run: () => openEncryptionModal(app) }
  ];

  let items = [];
  let selectedIdx = 0;

  const rebuild = () => {
    const q = input.value.trim();
    const nextItems = [];

    if (!q) {
      const recent = runFilter('[all[tiddlers]!sort[modified]limit[8]]', app.store).titles;
      for (const title of recent) {
        nextItems.push({ label: title, meta: t('tabRecent', lang), run: () => app.openCard(title) });
      }
      for (const cmd of commands) {
        nextItems.push({ label: cmd.label, meta: '>', run: cmd.run });
      }
    } else {
      const safeQ = q.replace(/\]/g, '');
      const cardMatches = runFilter('[all[tiddlers]search[' + safeQ + ']sort[title]limit[12]]', app.store).titles;
      for (const title of cardMatches) {
        const item = app.store.get(title);
        nextItems.push({
          label: title,
          meta: item && item.tags.length ? item.tags.join(', ') : '',
          run: () => app.openCard(title)
        });
      }
      const sysMatches = runFilter('[all[system]search[' + safeQ + ']sort[title]limit[5]]', app.store).titles;
      for (const title of sysMatches) {
        nextItems.push({ label: title, meta: t('tabSystem', lang), run: () => app.openCard(title) });
      }
      for (const cmd of commands) {
        if (cmd.label.toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr'))) {
          nextItems.push({ label: cmd.label, meta: '>', run: cmd.run });
        }
      }
      if (!app.store.has(q)) {
        nextItems.push({
          label: '+ ' + t('newCard', lang) + ': "' + q + '"',
          meta: t('newCard', lang),
          run: () => app.createNewCard({ title: q })
        });
      }
    }

    items = nextItems;
    selectedIdx = 0;
    renderList();
  };

  const renderList = () => {
    listEl.innerHTML = '';
    items.forEach((it, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'palette-item' + (idx === selectedIdx ? ' is-selected' : '');
      btn.innerHTML = '<span>' + escapeHtml(it.label) + '</span><span class="muted">' + escapeHtml(it.meta) + '</span>';
      btn.addEventListener('click', () => {
        close();
        it.run();
      });
      listEl.appendChild(btn);
    });
  };

  input.addEventListener('input', rebuild);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (items.length) {
        selectedIdx = (selectedIdx + 1) % items.length;
        renderList();
      }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (items.length) {
        selectedIdx = (selectedIdx - 1 + items.length) % items.length;
        renderList();
      }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (items[selectedIdx]) {
        const chosen = items[selectedIdx];
        close();
        chosen.run();
      }
    }
  });

  rebuild();
  setTimeout(() => input.focus(), 10);
}

function insertAtCursor(textarea, before, after = '', placeholder = '') {
  const start = textarea.selectionStart || 0;
  const end = textarea.selectionEnd || 0;
  const value = textarea.value;
  const selected = value.slice(start, end) || placeholder;
  const next = value.slice(0, start) + before + selected + after + value.slice(end);
  textarea.value = next;
  const cursorStart = start + before.length;
  const cursorEnd = cursorStart + selected.length;
  textarea.focus();
  textarea.setSelectionRange(cursorStart, cursorEnd);
  textarea.dispatchEvent(new Event('input'));
}

  const parts = String(dataUrl || '').split(',');
  const header = parts[0] || '';
  const b64 = parts[1] || '';
  const mimeMatch = /data:([^;]+)/i.exec(header);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';

  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });

function renderFilterTab(body, app, lang, openFn) {
  const expr = app.getFilterExpr();
  body.innerHTML =

      '<input class="input" data-flt-input type="text" placeholder="' + escapeHtml(t('filterPlaceholder', lang)) + '" value="' + escapeHtml(expr) + '" style="font-family:var(--font-mono);font-size:0.82rem;">' +

    '<div class="muted" data-flt-status></div>' +

      '<button type="button" class="btn btn-sm" data-flt-save>' + escapeHtml(t('filterSaveAsCard', lang)) + '</button>' +

    '</div>';

  const input = body.querySelector('[data-flt-input]');
  const statusEl = body.querySelector('[data-flt-status]');
  const resEl = body.querySelector('[data-flt-results]');

  const presets = [

    '[orphans[]]',

  ];
  for (const p of presets) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tag-pill is-system';
    btn.textContent = p;
    btn.addEventListener('click', () => {
      input.value = p;
      app.setFilterSearch(p);
    });
    presetsEl.appendChild(btn);
  }

  const exec = () => {
    const curExpr = input.value;
    app.setFilterExprQuiet(curExpr);
    const res = runFilter(curExpr, app.store, { currentTiddler: app.getActiveCard() });
    resEl.innerHTML = '';
    if (res.error) {
      statusEl.className = 'error-msg';
      statusEl.textContent = res.error;

    }
    statusEl.className = 'muted';
    statusEl.textContent = t('filterCount', lang, { count: res.titles.length });
